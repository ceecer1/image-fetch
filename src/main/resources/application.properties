spring.application.name=image-fetch

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/images}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update

# Image providers per animal type. {w}/{h} are replaced with random dimensions.
animal.sources.cat=https://cataas.com/cat
animal.sources.dog=https://place.dog/{w}/{h}
animal.sources.bear=https://placebear.com/{w}/{h}
